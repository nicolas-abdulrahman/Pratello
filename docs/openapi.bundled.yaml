      tags:
        - TerminalSessions
      summary: Open terminal session with branch shared PIN
      description: |
        The 6-digit PIN is shared per branch and rotates every 8 hours.
        Returns a device-bound token scoped to this branch, read-only orders
        access, expiring with the shift. Aggressively rate-limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
