openapi: 3.0.3
info:
  title: Pratello API
  version: 2.1.0
  description: |
    SaaS for restaurants — complete API.

    ## Auth model
    An account can hold up to two verified auth methods:
    - **email + password** (verified by email confirmation)
    - **phone** (verified by SMS OTP)

    At least one verified method must exist for the account to log in.
    An unverified phone is **contact data only** — it cannot be used for OTP login.
    Login via either method returns the same `TokenPair` (identical JWT claims).

    ## Auth levels
    - `public` — no auth
    - `user` — any authenticated account (bearer JWT)
    - `manager` — MANAGER or OWNER of the logical restaurant
    - `owner` — OWNER of the logical restaurant (entity-level actions)
    - `employee` — employee record of the branch
    - `terminal` — PIN terminal session (read-only orders, branch-scoped)
    - `sysadmin` — global sysadmin

    Terminal sessions are bearer JWTs obtained via
    `POST /restaurants/{slug}/branches/{branch_id}/terminal-sessions` using the
    branch's shared 6-digit PIN (rotates every 8h). Scoped to one branch,
    read-only orders, device-bound, expires with the shift.

    ## Money
    All monetary values are **integer cents** (BRL), fields suffixed `_cents`.

    ## Idempotency
    All payment-mutating endpoints require an `Idempotency-Key` header.

    ## Soft deletes
    Restaurants, branches, items, employees, and coupons are soft-deleted
    (archived), preserving order history integrity.

    ## Loyalty
    CPF can be attached to any order **without an account** — points accrue.
    **Redeeming** points requires an account whose CPF has been claimed via SMS.
    A CPF-only wallet is visible to restaurant staff and dormant for the customer
    until claimed.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Accounts
  - name: Restaurants
  - name: Owners
  - name: Managers
  - name: Branches
  - name: OperatingHours
  - name: Tables
  - name: Employees
  - name: TerminalSessions
  - name: StaffSessions
  - name: Menu
  - name: Categories
  - name: Items
  - name: Ingredients
  - name: Sides
  - name: Combos
  - name: Sales
  - name: Coupons
  - name: Loyalty
  - name: Orders
  - name: Payments
  - name: Sysadmins
  - name: Audit
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register with email + password (phone optional, unverified)
      description: |
        The `phone` field, if provided, is stored as **unverified contact data**.
        It cannot be used for OTP login until verified via `POST /me/phone/verify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register/phone/request-code:
    post:
      tags:
        - Auth
      summary: Start phone-only registration — sends SMS code
      description: |
        Always returns 202 (whether or not the phone is eligible) to prevent
        phone-number enumeration. If the phone already belongs to an account,
        the user should use `/auth/login/phone/request-code` instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
      responses:
        '202':
          description: Code sent if number is eligible
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/register/phone/verify:
    post:
      tags:
        - Auth
      summary: Complete phone-only registration with SMS code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                code:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Account created (phone-only, verified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login/phone/request-code:
    post:
      tags:
        - Auth
      summary: Request SMS login code (verified phones only)
      description: |
        Always returns 202 to prevent enumeration. Unverified phones are
        silently ignored (no code sent, no account lookup).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
      responses:
        '202':
          description: Code sent if phone is verified and belongs to an account
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login/phone/verify:
    post:
      tags:
        - Auth
      summary: Complete phone login with SMS code — same JWT as email login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Exchange refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke current refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags:
        - Auth
      summary: Revoke all refresh tokens and active JTIs for this account
      responses:
        '204':
          description: All sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/phone/request-code:
    post:
      tags:
        - Auth
      summary: Add or change phone — sends verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
      responses:
        '202':
          description: Code sent
        '409':
          description: Phone already used by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/phone/verify:
    post:
      tags:
        - Auth
      summary: Confirm new phone with SMS code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Phone verified and attached to this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
  /me/phone:
    delete:
      tags:
        - Auth
      summary: Remove phone from account
      description: Rejected with 409 if this is the last verified auth method.
      responses:
        '204':
          description: Removed
        '409':
          description: Cannot remove last verified auth method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me/email:
    put:
      tags:
        - Auth
      summary: Add or change email + password on this account
      description: |
        Used by phone-only accounts to add an email auth method.
        If an email already exists, requires `current_password` to confirm.
        New email requires confirmation via `/me/email/verify` before
        it becomes an active auth method.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                current_password:
                  type: string
      responses:
        '202':
          description: Email set, confirmation email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Auth
      summary: Remove email + password from account
      description: Rejected with 409 if this is the last verified auth method.
      responses:
        '204':
          description: Removed
        '409':
          description: Cannot remove last verified auth method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me/email/verify:
    post:
      tags:
        - Auth
      summary: Confirm email via token from confirmation email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
  /me/addresses:
    get:
      tags:
        - Accounts
      summary: List my saved addresses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedAddress'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Accounts
      summary: Save a new address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAddress'
        '400':
          $ref: '#/components/responses/BadRequest'
  /me/addresses/{address_id}:
    parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags:
        - Accounts
      summary: Update saved address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAddress'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Accounts
      summary: Delete saved address
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants:
    get:
      tags:
        - Restaurants
      summary: List restaurants (public discovery)
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRestaurants'
    post:
      tags:
        - Restaurants
      summary: Create restaurant (caller becomes first OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRestaurantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/restaurants:
    get:
      tags:
        - Restaurants
      summary: My memberships
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyRestaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /restaurants/{slug}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
    get:
      tags:
        - Restaurants
      summary: Get restaurant
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Restaurants
      summary: Update restaurant (OWNER)
      description: Slug is immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRestaurantRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Restaurants
      summary: Soft-delete restaurant (OWNER)
      responses:
        '204':
          description: Archived
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants/{slug}/owners:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
    get:
      tags:
        - Owners
      summary: List owners
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Owners
      summary: Appoint owner (requires OWNER consent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointOwnerRequest'
      responses:
        '201':
          description: Appointed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants/{slug}/owners/{account_id}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/AccountIdParam'
    delete:
      tags:
        - Owners
      summary: Remove owner (last owner cannot be removed)
      responses:
        '204':
          description: Removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Cannot remove the last owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /restaurants/{slug}/managers:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
    get:
      tags:
        - Managers
      summary: List managers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Managers
      summary: Add manager (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddManagerRequest'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants/{slug}/managers/{account_id}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/AccountIdParam'
    delete:
      tags:
        - Managers
      summary: Remove manager (OWNER)
      responses:
        '204':
          description: Removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants/{slug}/branches:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
    get:
      tags:
        - Branches
      summary: List branches
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranches'
    post:
      tags:
        - Branches
      summary: Create branch (OWNER, CNPJ verification required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /restaurants/{slug}/branches/{branch_id}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    get:
      tags:
        - Branches
      summary: Get branch
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Branches
      summary: Update branch (manager+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Branches
      summary: Deactivate branch (OWNER)
      responses:
        '204':
          description: Deactivated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants/{slug}/branches/{branch_id}/address:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    put:
      tags:
        - Branches
      summary: Update address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '403':
          $ref: '#/components/responses/Forbidden'
  /restaurants/{slug}/branches/{branch_id}/phones:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    get:
      tags:
        - Branches
      summary: List phones
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Phone'
    post:
      tags:
        - Branches
      summary: Add phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhoneRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phone'
        '403':
          $ref: '#/components/responses/Forbidden'
  /restaurants/{slug}/branches/{branch_id}/phones/{phone_id}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
      - name: phone_id
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags:
        - Branches
      summary: Remove phone
      responses:
        '204':
          description: Removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /restaurants/{slug}/branches/{branch_id}/hours:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    get:
      tags:
        - OperatingHours
      summary: Get operating hours
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperatingHour'
    put:
      tags:
        - OperatingHours
      summary: Replace operating hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OperatingHour'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperatingHour'
        '403':
          $ref: '#/components/responses/Forbidden'
  /restaurants/{slug}/branches/{branch_id}/tables:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    get:
      tags:
        - Tables
      summary: List tables
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'
    post:
      tags:
        - Tables
      summary: Create table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '403':
          $ref: '#/components/responses/Forbidden'
  /restaurants/{slug}/branches/{branch_id}/tables/{table_id}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
      - name: table_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags:
        - Tables
      summary: Update table
      requestBody:
        required: true
        content:
