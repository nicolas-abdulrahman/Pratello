components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT accepted from any of:
        - `POST /auth/login`
        - `POST /auth/login/phone/verify`
        - `POST /auth/register/phone/verify`
        - `POST /auth/refresh`
        - `POST /restaurants/{slug}/branches/{branch_id}/terminal-sessions`

        User and terminal tokens share the same header. The server distinguishes
        on the `typ` claim (`user` vs `terminal`). Terminal tokens only grant
        read-only orders access scoped to one branch — the server rejects them
        on any endpoint requiring a user, manager, owner, employee, or sysadmin role.
  parameters:
    SlugParam:
      name: slug
      in: path
      required: true
      schema:
        type: string
    BranchIdParam:
      name: branch_id
      in: path
      required: true
      schema:
        type: integer
    ItemIdParam:
      name: item_id
      in: path
      required: true
      schema:
        type: integer
    OrderIdParam:
      name: order_id
      in: path
      required: true
      schema:
        type: integer
    AccountIdParam:
      name: account_id
      in: path
      required: true
      schema:
        type: integer
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Missing/invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true
    ValidationError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
          example: VALIDATION_ERROR
        fields:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        phone:
          type: string
          description: Stored as unverified contact data. Use /me/phone/verify to enable OTP login.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: seconds
    Account:
      type: object
      required:
        - id
        - created_at
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
          nullable: true
          description: Null for phone-only accounts
        email_verified:
          type: boolean
        phone:
          type: string
          nullable: true
          description: Null for email-only accounts
        phone_verified:
          type: boolean
          description: Only verified phones can be used for OTP login
        created_at:
          type: string
          format: date-time
        two_factor_enabled:
          type: boolean
    JwtClaims:
      type: object
      description: |
        Informational only. Clients must not trust these claims for authorization —
        the server is the source of truth. Provided so clients can make UI decisions.
      properties:
        sub:
          type: integer
        typ:
          type: string
          enum:
            - user
            - terminal
        role:
          type: string
          enum:
            - OWNER
            - MANAGER
            - EMPLOYEE
            - TERMINAL
        restaurant_slug:
          type: string
          nullable: true
        branch_id:
          type: integer
          nullable: true
        scopes:
          type: array
          items:
            type: string
        jti:
          type: string
        iat:
          type: integer
        exp:
          type: integer
    Address:
      type: object
      required:
        - cep
        - street
