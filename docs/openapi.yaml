  # ============================================================
  /restaurants/{slug}/branches/{branch_id}/hours:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    get:
      tags: [OperatingHours]
      summary: Get weekly operating hours
      description: Pending branches follow the same visibility rules as branch details. Returns an empty array before a schedule is configured.
      security: [{}, {bearerAuth: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperatingHour'
    put:
      tags: [OperatingHours]
      summary: Replace operating hours
      description: Requires an organization Owner, global Administrator, or assigned branch Manager. Supply exactly one entry per weekday. Closed days omit times or use null; open days may cross midnight.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 7
              maxItems: 7
              items:
                $ref: '#/components/schemas/OperatingHour'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperatingHour'
        '403': { $ref: '#/components/responses/Forbidden' }

