openapi: 3.0.3
info:
  title: Pratello API
  description: >
    Documentação oficial da API do Pratello (SaaS para restaurantes e cardápios digitais interativos).
    Cobre todos os domínios: Autenticação, Estabelecimentos/Filiais, Cardápio/Catálogo/Receitas/Combos,
    Fidelidade, Pedidos (Salão & Delivery), Transações/PIX e Turnos de Trabalho.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Servidor Local de Desenvolvimento

paths:
  # ==========================================
  # AUTENTICAÇÃO E CONTAS
  # ==========================================
  /auth/register:
    post:
      summary: Cadastrar nova conta global
      tags: [Autenticação & Contas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      summary: Autenticar conta e obter token
      tags: [Autenticação & Contas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      summary: Obter dados da conta autenticada
      tags: [Autenticação & Contas]
      responses:
        '200':
          description: Dados do perfil autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sysadmins:
    get:
      summary: Listar superadministradores globais
      tags: [Autenticação & Contas]
      responses:
        '200':
          description: Lista de superadministradores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sysadmin'
    post:
      summary: Promover conta a superadministrador
      tags: [Autenticação & Contas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id:
                  type: integer
      responses:
        '201':
          description: Superadministrador registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sysadmin'

  /restaurants/{slug}/managers:
    get:
      summary: Listar gerentes do restaurante
      tags: [Autenticação & Contas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      responses:
        '200':
          description: Lista de gerentes vinculados ao restaurante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Manager'
    post:
      summary: Vincular conta de gerente a um restaurante
      tags: [Autenticação & Contas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id:
                  type: integer
      responses:
        '201':
          description: Gerente associado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manager'

  /restaurants/{slug}/managers/{account_id}:
    delete:
      summary: Desvincular gerente do restaurante
      tags: [Autenticação & Contas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Gerente desvinculado com sucesso
        '404':
          $ref: '#/components/responses/NotFound'

  /users:
    get:
      summary: Listar clientes consumidores
      tags: [Consumidores]
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Cadastrar consumidor final
      tags: [Consumidores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Cliente criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{cpf}:
    get:
      summary: Obter dados do cliente por CPF
      tags: [Consumidores]
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            example: "12345678901"
      responses:
        '200':
          description: Dados do cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualizar dados cadastrais do cliente
      tags: [Consumidores]
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ==========================================
  # ESTABELECIMENTOS E UNIDADES FÍSICAS
  # ==========================================
  /restaurants:
    get:
      summary: Listar marcas e estabelecimentos
      tags: [Restaurantes]
      responses:
        '200':
          description: Lista de restaurantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
    post:
      summary: Criar novo restaurante
      tags: [Restaurantes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRestaurantRequest'
      responses:
        '201':
          description: Restaurante cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '409':
          $ref: '#/components/responses/Conflict'

  /restaurants/{slug}:
    get:
      summary: Obter detalhes do restaurante por slug
      tags: [Restaurantes]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      responses:
        '200':
          description: Detalhes do restaurante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualizar informações do restaurante
      tags: [Restaurantes]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRestaurantRequest'
      responses:
        '200':
          description: Restaurante atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Remover restaurante
      tags: [Restaurantes]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      responses:
        '204':
          description: Restaurante removido com sucesso
        '404':
          $ref: '#/components/responses/NotFound'

  /restaurants/{slug}/branches:
    get:
      summary: Listar filiais físicas do restaurante
      tags: [Filiais & Unidades Físicas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      responses:
        '200':
          description: Lista de filiais físicas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhysicalRestaurant'
    post:
      summary: Cadastrar filial física com endereço
      tags: [Filiais & Unidades Físicas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Filial criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalRestaurant'

  /restaurants/{slug}/branches/{branch_id}:
    get:
      summary: Obter dados de uma filial física
      tags: [Filiais & Unidades Físicas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Dados da filial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalRestaurant'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualizar nome e dados operacionais da filial
      tags: [Filiais & Unidades Físicas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Filial atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalRestaurant'
    delete:
      summary: Desativar filial física
      tags: [Filiais & Unidades Físicas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '204':
          description: Filial desativada com sucesso

  /restaurants/{slug}/branches/{branch_id}/address:
    put:
      summary: Atualizar endereço postal da filial
      tags: [Filiais & Unidades Físicas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: Endereço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  /restaurants/{slug}/branches/{branch_id}/phones:
    get:
      summary: Listar telefones operacionais da filial
      tags: [Filiais & Unidades Físicas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Lista de telefones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantPhone'
    post:
      summary: Adicionar telefone à filial
      tags: [Filiais & Unidades Físicas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhoneRequest'
      responses:
        '201':
          description: Telefone adicionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantPhone'

  /restaurants/{slug}/branches/{branch_id}/phones/{phone_id}:
    delete:
      summary: Remover telefone da filial
      tags: [Filiais & Unidades Físicas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
        - name: phone_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Telefone removido com sucesso

  # ==========================================
  # CATÁLOGO, CARDÁPIO E ITENS
  # ==========================================
  /restaurants/{slug}/menu:
    get:
      summary: Obter configurações visuais do cardápio
      tags: [Cardápio & Layout]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      responses:
        '200':
          description: Configuração de tema e layout do cardápio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
    put:
      summary: Atualizar tema, cores e tipografia do cardápio
      tags: [Cardápio & Layout]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuRequest'
      responses:
        '200':
          description: Configurações do cardápio salvas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'

  /restaurants/{slug}/categories:
    get:
      summary: Listar categorias do cardápio
      tags: [Categorias]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      responses:
        '200':
          description: Lista de seções/categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      summary: Criar nova categoria
      tags: [Categorias]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /restaurants/{slug}/categories/{id}:
    put:
      summary: Atualizar nome ou ordem de exibição da categoria
      tags: [Categorias]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      summary: Excluir categoria
      tags: [Categorias]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Categoria excluída

  /restaurants/{slug}/items:
    get:
      summary: Listar produtos e itens do catálogo
      tags: [Itens do Catálogo]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: category_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Lista de itens vendáveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
    post:
      summary: Criar novo item no catálogo
      tags: [Itens do Catálogo]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuItemRequest'
      responses:
        '201':
          description: Item criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'

  /restaurants/{slug}/items/{id}:
    get:
      summary: Obter detalhes do item com ingredientes e opcionais
      tags: [Itens do Catálogo]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Detalhes completos do item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualizar item do catálogo
      tags: [Itens do Catálogo]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuItemRequest'
      responses:
        '200':
          description: Item atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
    delete:
      summary: Remover item do catálogo
      tags: [Itens do Catálogo]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: Item removido

  /restaurants/{slug}/ingredients:
    get:
      summary: Listar catálogo base de ingredientes
      tags: [Ingredientes & Ficha Técnica]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      responses:
        '200':
          description: Lista de ingredientes cadastrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngredientItem'
    post:
      summary: Cadastrar ingrediente base
      tags: [Ingredientes & Ficha Técnica]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Queijo Cheddar"
      responses:
        '201':
          description: Ingrediente cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientItem'

  /restaurants/{slug}/items/{item_id}/ingredients:
    get:
      summary: Listar ingredientes da ficha técnica do item
      tags: [Ingredientes & Ficha Técnica]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ingredientes associados ao item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemIngredient'
    post:
      summary: Associar ingrediente com regras de remoção ao item
      tags: [Ingredientes & Ficha Técnica]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemIngredientRequest'
      responses:
        '201':
          description: Ingrediente vinculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemIngredient'

  /restaurants/{slug}/items/{item_id}/ingredients/{ingredient_id}:
    delete:
      summary: Desvincular ingrediente do item
      tags: [Ingredientes & Ficha Técnica]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
        - name: ingredient_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Ingrediente desvinculado

  /restaurants/{slug}/items/{item_id}/sides:
    get:
      summary: Listar grupos de opcionais/adicionais do item
      tags: [Opcionais & Adicionais]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Grupos de adicionais e opções
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemSide'
    post:
      summary: "Criar grupo de adicionais (ex.: Escolha o Ponto, Molhos)"
      tags: [Opcionais & Adicionais]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemSideRequest'
      responses:
        '201':
          description: Grupo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSide'

  /restaurants/{slug}/items/{item_id}/sides/{side_id}/options:
    post:
      summary: Adicionar opção de escolha ao grupo
      tags: [Opcionais & Adicionais]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
        - name: side_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSideOptionRequest'
      responses:
        '201':
          description: Opção adicionada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SideOption'

  /restaurants/{slug}/items/{item_id}/combo-items:
    get:
      summary: Obter composição da receita do combo
      tags: [Combos & Receitas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Produtos que compõem o combo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComboItem'
    post:
      summary: Adicionar produto unitário à receita do combo
      tags: [Combos & Receitas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComboItemRequest'
      responses:
        '201':
          description: Item adicionado ao combo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComboItem'

  /restaurants/{slug}/items/{item_id}/sales:
    get:
      summary: Listar promoções temporárias do item
      tags: [Promoções & Descontos]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Histórico de promoções
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemSale'
    post:
      summary: Aplicar desconto promocional temporário ao item
      tags: [Promoções & Descontos]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemSaleRequest'
      responses:
        '201':
          description: Promoção criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSale'

  # ==========================================
  # FIDELIDADE E CUPONS
  # ==========================================
  /restaurants/{slug}/users/{cpf}/wallet:
    get:
      summary: Consultar saldo de pontos de fidelidade do cliente
      tags: [Fidelidade & Cupons]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: cpf
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saldo de pontos do cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRestaurantWallet'
    post:
      summary: Creditar ou debitar saldo de pontos
      tags: [Fidelidade & Cupons]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: cpf
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points_delta, reason]
              properties:
                points_delta:
                  type: integer
                  example: 50
                reason:
                  type: string
                  example: "Bonificação por compra"
      responses:
        '200':
          description: Saldo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRestaurantWallet'

  /restaurants/{slug}/coupons:
    get:
      summary: Listar cupons de desconto do restaurante
      tags: [Fidelidade & Cupons]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      responses:
        '200':
          description: Lista de cupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coupon'
    post:
      summary: Criar cupom promocional
      tags: [Fidelidade & Cupons]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCouponRequest'
      responses:
        '201':
          description: Cupom criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'

  /restaurants/{slug}/coupons/{code}:
    get:
      summary: Validar cupom por código
      tags: [Fidelidade & Cupons]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "PRATELLO10"
      responses:
        '200':
          description: Dados do cupom e regras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # VENDAS E PEDIDOS (SALÃO E DELIVERY)
  # ==========================================
  /restaurants/{slug}/branches/{branch_id}/orders:
    get:
      summary: Listar comandas e pedidos da filial física
      tags: [Pedidos & Vendas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, preparing, ready, delivered, cancelled]
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /restaurants/{slug}/branches/{branch_id}/orders/local:
    post:
      summary: Abrir comanda/pedido presencial no salão
      tags: [Pedidos & Vendas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocalOrderRequest'
      responses:
        '201':
          description: Pedido de mesa aberto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /restaurants/{slug}/branches/{branch_id}/orders/remote:
    post:
      summary: Criar pedido para entrega (Delivery)
      tags: [Pedidos & Vendas]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRemoteOrderRequest'
      responses:
        '201':
          description: Pedido de delivery registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{order_id}:
    get:
      summary: Obter detalhes completos do pedido
      tags: [Pedidos & Vendas]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido com itens, salão/delivery e transações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{order_id}/status:
    patch:
      summary: Atualizar status operacional do pedido
      tags: [Pedidos & Vendas]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, preparing, ready, delivered, cancelled]
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{order_id}/items:
    post:
      summary: Adicionar item à comanda/pedido aberto
      tags: [Pedidos & Vendas]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderItemRequest'
      responses:
        '201':
          description: Item inserido no pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'

  /orders/{order_id}/items/{order_item_id}:
    delete:
      summary: Cancelar ou remover item de pedido aberto
      tags: [Pedidos & Vendas]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: order_item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Item removido

  # ==========================================
  # PAGAMENTOS E FATURAMENTO
  # ==========================================
  /orders/{order_id}/transactions:
    get:
      summary: Listar tentativas e pagamentos do pedido
      tags: [Pagamentos & Faturamento]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Transações financeiras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
    post:
      summary: Iniciar pagamento do pedido
      tags: [Pagamentos & Faturamento]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Transação gerada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'

  /transactions/{transaction_id}/pix:
    get:
      summary: Consultar dados e status do pagamento PIX
      tags: [Pagamentos & Faturamento]
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: QR Code e código copia e cola
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPix'
    post:
      summary: Gerar QR Code PIX para a transação
      tags: [Pagamentos & Faturamento]
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: PIX gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPix'

  /orders/{order_id}/receipt:
    get:
      summary: Obter recibo e comprovante digital do pedido
      tags: [Pagamentos & Faturamento]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Recibo estruturado em JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'

  # ==========================================
  # OPERAÇÃO DE TURNOS E EQUIPE
  # ==========================================
  /restaurants/{slug}/branches/{branch_id}/staff-sessions:
    get:
      summary: Listar turnos operacionais da filial física
      tags: [Turnos & Equipe]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Turnos registrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantStaffSession'

  /restaurants/{slug}/branches/{branch_id}/staff-sessions/open:
    post:
      summary: Abrir novo turno de trabalho e gerar QR token
      tags: [Turnos & Equipe]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_code]
              properties:
                shift_code:
                  type: string
                  example: "ALMOCO-2026-10-12"
      responses:
        '201':
          description: Turno aberto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantStaffSession'

  /restaurants/{slug}/branches/{branch_id}/staff-sessions/{session_id}/close:
    post:
      summary: Encerrar turno de trabalho
      tags: [Turnos & Equipe]
      parameters:
        - $ref: '#/components/parameters/RestaurantSlug'
        - $ref: '#/components/parameters/BranchId'
        - name: session_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Turno encerrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantStaffSession'

  /staff-sessions/check-in:
    post:
      summary: Bater ponto de entrada em turno aberto
      tags: [Turnos & Equipe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token, account_id]
              properties:
                qr_token:
                  type: string
                account_id:
                  type: integer
      responses:
        '201':
          description: Entrada registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'

  /staff-sessions/{id}/check-out:
    post:
      summary: Bater ponto de saída do turno
      tags: [Turnos & Equipe]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Saída registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'

# ==========================================
# COMPONENTES, ESQUEMAS E DTOs (28 TABELAS)
# ==========================================
components:
  parameters:
    RestaurantSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        example: "pizzaria-pratello"
    BranchId:
      name: branch_id
      in: path
      required: true
      schema:
        type: integer
        example: 1
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        example: 42
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: integer
        example: 101

  responses:
    BadRequest:
      description: Requisição inválida ou parâmetros ausentes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Não autorizado ou token ausente/inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: "Conflito de dados (ex: chave única duplicada)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Descrição do erro ocorrido"

    # 1. account
    Account:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        phone:
          type: string
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        phone:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        account:
          $ref: '#/components/schemas/Account'

    # 2. sysadmin
    Sysadmin:
      type: object
      properties:
        id:
          type: integer
        account_id:
          type: integer
        created_at:
          type: string
          format: date-time

    # 3. manager
    Manager:
      type: object
      properties:
        id:
          type: integer
        restaurant_slug:
          type: string
        account_id:
          type: integer

    # 4. users (consumidor final)
    User:
      type: object
      properties:
        cpf:
          type: string
        name:
          type: string
        phone:
          type: string
        created_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [cpf, name, phone]
      properties:
        cpf:
          type: string
        name:
          type: string
        phone:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string

    # 5. restaurant
    Restaurant:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string

    CreateRestaurantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    UpdateRestaurantRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    # 6. physical_restaurant
    PhysicalRestaurant:
      type: object
      properties:
        id:
          type: integer
        restaurant_slug:
          type: string
        name:
          type: string
        address:
          $ref: '#/components/schemas/Address'

    CreateBranchRequest:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
        address:
          $ref: '#/components/schemas/Address'

    # 7. Address
    Address:
      type: object
      required: [cep, street, number]
      properties:
        id:
          type: integer
        cep:
          type: string
        street:
          type: string
        number:
          type: string
        apt:
          type: string
        complement:
          type: string

    # 8. p_restaurant_phone
    RestaurantPhone:
      type: object
      properties:
        id:
          type: integer
        branch_id:
          type: integer
        phone_number:
          type: string
        phone_type:
          type: string
          example: "whatsapp"

    CreatePhoneRequest:
      type: object
      required: [phone_number]
      properties:
        phone_number:
          type: string
        phone_type:
          type: string

    # 9. menu
    Menu:
      type: object
      properties:
        id:
          type: integer
        restaurant_slug:
          type: string
        name:
          type: string
        template_style:
          type: string
          example: "classic"
        accent_color:
          type: string
          example: "#FF5722"
        typography:
          type: string
          example: "Inter"

    UpdateMenuRequest:
      type: object
      properties:
        name:
          type: string
        template_style:
          type: string
        accent_color:
          type: string
        typography:
          type: string

    # 10. category
    Category:
      type: object
      properties:
        id:
          type: integer
        restaurant_slug:
          type: string
        name:
          type: string
        display_order:
          type: integer

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        display_order:
          type: integer

    # 11. menu_item
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
        name:
          type: string
        description:
          type: string
        base_price:
          type: number
          format: float
        photo_url:
          type: string
        is_combo:
          type: boolean
        is_available:
          type: boolean

    CreateMenuItemRequest:
      type: object
      required: [category_id, name, base_price]
      properties:
        category_id:
          type: integer
        name:
          type: string
        description:
          type: string
        base_price:
          type: number
          format: float
        photo_url:
          type: string
        is_combo:
          type: boolean
        is_available:
          type: boolean

    MenuItemDetail:
      allOf:
        - $ref: '#/components/schemas/MenuItem'
        - type: object
          properties:
            ingredients:
              type: array
              items:
                $ref: '#/components/schemas/ItemIngredient'
            sides:
              type: array
              items:
                $ref: '#/components/schemas/ItemSide'

    # 12. Ingredient_item
    IngredientItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    # 13. item_ingredient
    ItemIngredient:
      type: object
      properties:
        item_id:
          type: integer
        ingredient_id:
          type: integer
        name:
          type: string
        proportion:
          type: string
          example: "100g"
        is_removable:
          type: boolean

    CreateItemIngredientRequest:
      type: object
      required: [ingredient_id]
      properties:
        ingredient_id:
          type: integer
        proportion:
          type: string
        is_removable:
          type: boolean

    # 14. item_side
    ItemSide:
      type: object
      properties:
        id:
          type: integer
        item_id:
          type: integer
        title:
          type: string
        min_options:
          type: integer
        max_options:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/SideOption'

    CreateItemSideRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        min_options:
          type: integer
        max_options:
          type: integer

    # 15. side_option
    SideOption:
      type: object
      properties:
        id:
          type: integer
        side_id:
          type: integer
        name:
          type: string
        additional_price:
          type: number
          format: float

    CreateSideOptionRequest:
      type: object
      required: [name, additional_price]
      properties:
        name:
          type: string
        additional_price:
          type: number
          format: float

    # 16. combo_item
    ComboItem:
      type: object
      properties:
        combo_id:
          type: integer
        sub_item_id:
          type: integer
        sub_item_name:
          type: string
        quantity:
          type: integer

    CreateComboItemRequest:
      type: object
      required: [sub_item_id, quantity]
      properties:
        sub_item_id:
          type: integer
        quantity:
          type: integer

    # 17. item_sale
    ItemSale:
      type: object
      properties:
        id:
          type: integer
        item_id:
          type: integer
        discount_type:
          type: string
          enum: [percent, fixed]
        discount_value:
          type: number
          format: float
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    CreateItemSaleRequest:
      type: object
      required: [discount_type, discount_value, starts_at, ends_at]
      properties:
        discount_type:
          type: string
          enum: [percent, fixed]
        discount_value:
          type: number
          format: float
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    # 18. user_restaurant
    UserRestaurantWallet:
      type: object
      properties:
        user_cpf:
          type: string
        restaurant_slug:
          type: string
        points_balance:
          type: integer

    # 19. coupon
    Coupon:
      type: object
      properties:
        id:
          type: integer
        restaurant_slug:
          type: string
        code:
          type: string
        discount_type:
          type: string
          enum: [percent, fixed]
        discount_value:
          type: number
          format: float
        min_order_value:
          type: number
          format: float
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: integer

    CreateCouponRequest:
      type: object
      required: [code, discount_type, discount_value]
      properties:
        code:
          type: string
        discount_type:
          type: string
          enum: [percent, fixed]
        discount_value:
          type: number
          format: float
        min_order_value:
          type: number
          format: float
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: integer

    # 20. order
    Order:
      type: object
      properties:
        id:
          type: integer
        branch_id:
          type: integer
        user_cpf:
          type: string
        order_type:
          type: string
          enum: [local, remote]
        status:
          type: string
          enum: [pending, preparing, ready, delivered, cancelled]
        subtotal:
          type: number
          format: float
        discount:
          type: number
          format: float
        total:
          type: number
          format: float
        created_at:
          type: string
          format: date-time

    # 21. local_order
    LocalOrderInfo:
      type: object
      properties:
        table_number:
          type: integer
        display_order:
          type: integer

    CreateLocalOrderRequest:
      type: object
      required: [table_number, items]
      properties:
        user_cpf:
          type: string
        table_number:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/AddOrderItemRequest'

    # 22. remote_order
    RemoteOrderInfo:
      type: object
      properties:
        delivery_address:
          $ref: '#/components/schemas/Address'
        phone:
          type: string
        freight_fee:
          type: number
          format: float

    CreateRemoteOrderRequest:
      type: object
      required: [delivery_address, phone, items]
      properties:
        user_cpf:
          type: string
        delivery_address:
          $ref: '#/components/schemas/Address'
        phone:
          type: string
        freight_fee:
          type: number
          format: float
        items:
          type: array
          items:
            $ref: '#/components/schemas/AddOrderItemRequest'

    # 23. order_item
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        item_id:
          type: integer
        item_name:
          type: string
        unit_price_frozen:
          type: number
          format: float
        quantity:
          type: integer
        notes:
          type: string
        parent_order_item_id:
          type: integer

    AddOrderItemRequest:
      type: object
      required: [item_id, quantity]
      properties:
        item_id:
          type: integer
        quantity:
          type: integer
        notes:
          type: string
        parent_order_item_id:
          type: integer

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            local_info:
              $ref: '#/components/schemas/LocalOrderInfo'
            remote_info:
              $ref: '#/components/schemas/RemoteOrderInfo'
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'

    # 24. transaction
    Transaction:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        amount:
          type: number
          format: float
        payment_method:
          type: string
          enum: [credit_card, debit_card, pix, cash]
        status:
          type: string
          enum: [pending, paid, failed, refunded]
        created_at:
          type: string
          format: date-time

    CreateTransactionRequest:
      type: object
      required: [payment_method, amount]
      properties:
        payment_method:
          type: string
          enum: [credit_card, debit_card, pix, cash]
        amount:
          type: number
          format: float

    # 25. transaction_pix
    TransactionPix:
      type: object
      properties:
        transaction_id:
          type: integer
        copy_paste_code:
          type: string
        qr_code_base64:
          type: string
        expires_at:
          type: string
          format: date-time

    # 26. receipt
    Receipt:
      type: object
      properties:
        receipt_code:
          type: string
        order_id:
          type: integer
        receipt_json:
          type: object
          description: Conteúdo estruturado do comprovante fiscal/digital
        issued_at:
          type: string
          format: date-time

    # 27. restaurant_staff_session
    RestaurantStaffSession:
      type: object
      properties:
        id:
          type: integer
        branch_id:
          type: integer
        shift_code:
          type: string
        qr_token:
          type: string
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time

    # 28. staff_session
    StaffSession:
      type: object
      properties:
        id:
          type: integer
        restaurant_staff_session_id:
          type: integer
        account_id:
          type: integer
        checked_in_at:
          type: string
          format: date-time
        checked_out_at:
          type: string
          format: date-time
