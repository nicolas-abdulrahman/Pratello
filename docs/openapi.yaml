openapi: 3.0.3
# ============================================================
# info.description (replace the current description)
# ============================================================
info:
  title: Pratello API
  version: 2.2.8
  description: |
    SaaS for restaurants — complete API.

    ## Auth model
    An account can hold up to two verified auth methods:
    - **email + password** (verified by email confirmation)
    - **phone** (verified by a six-digit WhatsApp PIN)

    Login via either method returns the same `TokenPair` (identical JWT claims).
    At least one verified method must exist for the account to log in.

    ### Shadow accounts
    When a CPF is entered on an order (at the register) and no account exists
    for it, a **shadow account** is created automatically: only `cpf` is set,
    no email/phone/password. Shadows can accrue loyalty coins but **cannot log
    in**. They are graduated to real accounts in one of two ways:

    - **At registration** — the user provides their CPF; if it matches a shadow,
      the shadow is graduated in place (email/password written onto it, existing
      wallets become immediately accessible).
    - **At claim** — an already-logged-in account calls `PUT /me/cpf`; if the
      CPF is on a shadow, wallets move to the current account and the shadow is
      deleted.

    If the CPF is already on a **real** account, both paths return `409`.

    ## Auth levels
    `ADMINISTRATOR` has authority across all organizations and branches.
    `MANAGER` and `EMPLOYEE` grants apply only to their assigned branches.
    - `public`   — no auth
    - `user`     — any authenticated account (bearer JWT)
    - `manager`  — assigned branch Manager, organization Owner, or global Administrator
    - `owner`    — OWNER of the logical restaurant (entity-level actions)
    - `employee` — employee record at the branch (permissions by position)
    - `analyst`  — read-only across all branches of a logical restaurant
    - `sysadmin` — global platform admin

    There is no separate terminal/PIN auth layer. Every device (customer phone,
    employee phone, shared tablet) authenticates via account login.

    ## Money
    All monetary values are **integer cents** (BRL), fields suffixed `_cents`.

    ## Idempotency
    Payment creation and refunds require an `Idempotency-Key` header. Keys are
    stored in PostgreSQL, scoped to the order or transaction. A PIX transaction
    has one charge; confirming it again does not settle it twice.

    ## Soft deletes
    Restaurants, branches, items, employees, and coupons are soft-deleted
    (archived), preserving order history integrity.

    ## Loyalty
    Coins accrue against the wallet of the account resolved from the CPF on the
    order. Redeeming requires a **real** account (shadows cannot log in). See
    "Shadow accounts" above for how shadows become real.

security:
  - bearerAuth: []

# ============================================================
# paths — AUTH
# ============================================================
paths:
  # ----------------------------------------------------------
  # Registration — email + password
  # ----------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Register with email + password (CPF optional)
      description: |
        Creates a real account. Confirmation is mocked and succeeds immediately;
        no confirmation token or user action is required.

        **CPF handling:**
        - If `cpf` is omitted → no shadow interaction; new account has no CPF.
        - If `cpf` is on a **shadow account** → shadow is graduated in place:
          the existing shadow row is updated with `email` and `password`, and
          its wallets become immediately accessible. The returned tokens belong
          to the (now real) account that was the shadow.
        - If `cpf` is on a **real account** → `409 Conflict`.
        - If `cpf` is unused → stored on the new account.

        **Phone handling:** `phone`, if provided, is stored as **unverified
        contact data**. It cannot be used for OTP login until verified via
        `POST /me/phone/verify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created (or shadow graduated in place)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email + password
      description: Shadows cannot log in (no password). Only real accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------
  # Registration — phone only
  # ----------------------------------------------------------
  /auth/register/phone/request-code:
    post:
      tags: [Auth]
      summary: Start phone-only registration — sends WhatsApp PIN
      description: |
        Always returns `202` (whether or not the phone is eligible) to prevent
        phone-number enumeration. Use `/auth/login/phone/request-code` if the
        phone already belongs to an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '202': { description: Code sent if number is eligible }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/register/phone/verify:
    post:
      tags: [Auth]
      summary: Complete phone-only registration with six-digit WhatsApp PIN (CPF optional)
      description: |
        PIN verification is mocked, so the client need not submit a code.
        Same CPF/shadow graduation logic as `POST /auth/register`.
        If `cpf` matches a shadow account, the shadow is graduated in place.
        If it matches a real account, `409 Conflict`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
                name: { type: string }
                cpf:
                  type: string
                  pattern: '^[0-9]{11}$'
                  description: Optional. Graduates a matching shadow account.
      responses:
        '201':
          description: Account created (or shadow graduated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------
  # Login — phone OTP
  # ----------------------------------------------------------
  /auth/login/phone/request-code:
    post:
      tags: [Auth]
      summary: Request WhatsApp login PIN (verified phones only)
      description: |
        Always returns `202` to prevent enumeration. Unverified phones and
        shadow accounts (no phone) are silently ignored.
        Delivery and PIN verification are currently mocked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '202': { description: Code sent if phone is verified and belongs to an account }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login/phone/verify:
    post:
      tags: [Auth]
      summary: Complete phone login — same JWT as email login
      description: |
        Verification is mocked: clients do not need to supply a PIN. Only an
        already verified phone can be used to log in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------
  # Session lifecycle
  # ----------------------------------------------------------
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke all refresh tokens and bump token_version
      responses:
        '204': { description: All sessions revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current account
      description: |
        Always returns a real account (shadows cannot authenticate). If the
        account was graduated from a shadow, its `cpf` will be set and
        `cpf_claimed_at` populated.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------
  # CPF management (NEW — replaces "claim_loyalty" flow)
  # ----------------------------------------------------------
  /me/avatar:
    put:
      tags: [Auth]
      summary: Set the authenticated account's profile image URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [avatar_url]
              properties:
                avatar_url: { type: string, maxLength: 2048, description: HTTP(S) or a local /media/ URL. Use an empty string to remove the avatar. }
      responses:
        '200':
          description: Updated account profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /me/cpf:
    put:
      tags: [Auth]
      summary: Claim a CPF on the current account
      description: |
        Links a CPF to the logged-in account.

        **Behavior:**
        - CPF is unused → set on this account.
        - CPF is on a **shadow account** → merge: all wallets move to the
          current account, the shadow row is deleted, then the CPF is set on
          the current account. This is how an existing user absorbs a shadow
          that was created by a cashier before they signed up.
        - CPF is on a **real account** (including this one) → `409 Conflict`.
        - Current account already has a different CPF → `409 Conflict`
          (CPFs are identity — contact support to change).

        **No phone verification is required** because shadow accounts have no
        contact method to verify against. The user is asserting ownership of
        the CPF, same as they would to a cashier. The UNIQUE constraint on
        `account.cpf` prevents two claims for the same CPF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf]
              properties:
                cpf:
                  type: string
                  pattern: '^[0-9]{11}$'
      responses:
        '200':
          description: CPF linked (shadow merged if applicable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: CPF already belongs to a real account, or account already has a different CPF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Auth]
      summary: Remove CPF from the current account
      description: |
        Unlinks the CPF from this account. Existing wallets are **not** affected
        — wallets are keyed by `account_id`, not by CPF, so coins remain
        accessible. A future order with the same CPF will create a new shadow.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------
  # Auth method management — phone
  # ----------------------------------------------------------
  /me/phone/request-code:
    post:
      tags: [Auth]
      summary: Add or change phone — sends WhatsApp PIN
      description: |
        Verification is mocked, so the phone is attached and marked verified
        immediately after the notification succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '202': { description: Code sent }
        '409':
          description: Phone already used by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/phone/verify:
    post:
      tags: [Auth]
      summary: Retrieve the account after mocked phone confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Phone verified and attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/BadRequest' }

  /me/phone:
    delete:
      tags: [Auth]
      summary: Remove phone from account
      description: Rejected with 409 if this would leave no verified auth method.
      responses:
        '204': { description: Removed }
        '409':
          description: Cannot remove last verified auth method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------
  # Auth method management — email
  # ----------------------------------------------------------
  /me/email:
    put:
      tags: [Auth]
      summary: Add or change email + password
      description: |
        Confirmation is mocked, so the email becomes active immediately.
        If an email is already set, requires
        `current_password` to confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                current_password: { type: string }
      responses:
        '202':
          description: Email set, confirmation email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Auth]
      summary: Remove email + password
      description: Rejected with 409 if this would leave no verified auth method.
      responses:
        '204': { description: Removed }
        '409':
          description: Cannot remove last verified auth method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/email/verify:
    post:
      tags: [Auth]
      summary: Retrieve account after mocked email confirmation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/BadRequest' }

  # ============================================================
  # RESTAURANTS (Organization)
  # ============================================================
  /restaurants:
    get:
      tags: [Restaurants]
      summary: List restaurants (public discovery)
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRestaurants'
    post:
      tags: [Restaurants]
      summary: Create a new Organization (caller becomes first Owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRestaurantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/restaurants:
    get:
      tags: [Restaurants]
      summary: List my Organization memberships and roles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyRestaurant'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /restaurants/{slug}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
    get:
      tags: [Restaurants]
      summary: Get Organization details (public)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Restaurants]
      summary: Update Organization details
      description: Requires an organization Owner or global Administrator. Slug is immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRestaurantRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Restaurants]
      summary: Soft-delete Organization
      description: Requires Owner. Archives the organization without erasing historical order/financial records.
      responses:
        '204': { description: Archived }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # BRANCHES (Physical Establishments)
  # ============================================================
  /restaurants/{slug}/branches:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
    get:
      tags: [Branches]
      summary: List branches
      description: Public responses include only active, verified branches. Owners, global Administrators, assigned branch Managers, and Platform Sysadmins can see pending branches within their scope.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranches'
    post:
      tags: [Branches]
      summary: Create branch (requires an organization Owner or global Administrator)
      description: |
        Creates a new physical branch.
        The branch is pending verification when `cnpj_verified` is false.
        It cannot accept orders or publish menus until a Platform Sysadmin reviews and verifies the provided CNPJ and Owner CNPJ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Created (Pending Verification)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /restaurants/{slug}/branches/{branch_id}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    get:
      tags: [Branches]
      summary: Get branch details
      description: Pending branches are visible only to organization Owners, global Administrators, assigned branch Managers, and Platform Sysadmins. Owner CNPJ is omitted from public responses.
      security: [{}, {bearerAuth: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Branches]
      summary: Update branch details
      description: Requires an organization Owner, global Administrator, or assigned branch Manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Branches]
      summary: Deactivate branch
      description: Requires an organization Owner or global Administrator.
      responses:
        '204': { description: Deactivated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /restaurants/{slug}/branches/{branch_id}/verification:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    put:
      tags: [Branches]
      summary: Approve the branch's legal registration
      description: Platform Sysadmin or global Administrator. Records approval after manual review of both CNPJs and makes the active branch publicly visible.
      responses:
        '200':
          description: Verified branch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /restaurants/{slug}/branches/{branch_id}/address:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    put:
      tags: [Branches]
      summary: Update physical address
      description: Requires an organization Owner, global Administrator, or assigned branch Manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurants/{slug}/branches/{branch_id}/managers:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    get:
      tags: [Branches]
      summary: List Managers assigned to this branch (Owner or Administrator)
      responses:
        '200':
          description: Branch Manager assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    account_id: { type: integer }
                    branch_id: { type: integer }
                    role: { type: string, enum: [MANAGER] }
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurants/{slug}/branches/{branch_id}/managers/{account_id}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
      - $ref: '#/components/parameters/AccountIdParam'
    put:
      tags: [Branches]
      summary: Assign a Manager to this branch
      description: Requires an organization Owner or global Administrator. The target must have a verified login method. The assignment grants no authority over other branches.
      responses:
        '204': { description: Assigned }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Branches]
      summary: Revoke a branch Manager assignment
      description: Requires an organization Owner or global Administrator.
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # BRANCH PHONES
  # ============================================================
  /restaurants/{slug}/branches/{branch_id}/phones:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    get:
      tags: [Branches]
      summary: List contact phones
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Phone'
    post:
      tags: [Branches]
      summary: Add contact phone
      description: Requires an organization Owner, global Administrator, or assigned branch Manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhoneRequest'
      responses:
