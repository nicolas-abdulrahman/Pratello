        content:
          application/json:
            schema:
              type: object
              required: [title, min_options, max_options]
              properties:
                title: { type: string }
                min_options: { type: integer }
                max_options: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Side'
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Sides]
      summary: Delete side group
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurants/{slug}/items/{item_id}/sides/{side_id}/options:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/ItemIdParam'
      - name: side_id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Sides]
      summary: Add option
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, additional_price_cents]
              properties:
                name: { type: string }
                additional_price_cents: { type: integer, minimum: 0 }
                is_available: { type: boolean, default: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SideOption'
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurants/{slug}/items/{item_id}/sides/{side_id}/options/{option_id}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/ItemIdParam'
      - name: side_id
        in: path
        required: true
        schema: { type: integer }
      - name: option_id
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Sides]
      summary: Update option
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, additional_price_cents]
              properties:
                name: { type: string }
                additional_price_cents: { type: integer, minimum: 0 }
                is_available: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SideOption'
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Sides]
      summary: Delete option
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurants/{slug}/branches/{branch_id}/items/{item_id}/sides/{side_id}/options/{option_id}/availability:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
      - $ref: '#/components/parameters/ItemIdParam'
      - { name: side_id, in: path, required: true, schema: { type: integer } }
      - { name: option_id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Sides]
      summary: Set per-branch option availability (Owner, Administrator, or Manager of this branch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_available]
              properties:
                is_available: { type: boolean }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # COMBOS
  # ============================================================
  /restaurants/{slug}/items/{item_id}/combo-items:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/ItemIdParam'
    get:
      tags: [Combos]
      summary: List combo composition
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/MenuBranchQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComboItem'
    post:
      tags: [Combos]
      summary: Add item to combo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sub_item_id, quantity]
              properties:
                sub_item_id: { type: integer }
                quantity: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComboItem'
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurants/{slug}/items/{item_id}/combo-items/{combo_item_id}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/ItemIdParam'
      - name: combo_item_id
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Combos]
      summary: Update combo item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComboItem'
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Combos]
      summary: Remove combo item
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================================================
  # SALES
  # ============================================================
  /restaurants/{slug}/items/{item_id}/sales:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/ItemIdParam'
    get:
      tags: [Sales]
      summary: List item sales
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/MenuBranchQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemSale'
    post:
      tags: [Sales]
      summary: Create item sale
      description: Branch sales take precedence over organization sales. For overlapping active sales in the same scope, the most recently created sale takes precedence. Discounts never stack.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemSaleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSale'
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurants/{slug}/items/{item_id}/sales/{sale_id}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/ItemIdParam'
      - name: sale_id
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Sales]
      summary: Cancel sale
      parameters:
        - $ref: '#/components/parameters/MenuBranchQuery'
      responses:
        '204': { description: Cancelled }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================================================
  # COUPONS
  # ============================================================
  /restaurants/{slug}/coupons:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
    get:
      tags: [Coupons]
      summary: List coupons
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCoupons'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Coupons]
      summary: Create coupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCouponRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurants/{slug}/coupons/{code}:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - name: code
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Coupons]
      summary: Validate coupon (public)
      security: []
      parameters:
        - name: subtotal_cents
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Coupon status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponValidation'
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Coupons]
      summary: Update coupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCouponRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Coupons]
      summary: Deactivate coupon
      responses:
        '204': { description: Deactivated }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================================================
  # PROMOTIONAL BANNERS AND CHECKOUT
  # ============================================================
  /restaurants/{slug}/menu/banners:
    get:
      tags: [Coupons]
      summary: List active storefront banner coupons
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/MenuBranchQuery'
      responses:
        '200':
          description: Available banners for a published storefront
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Coupon' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /restaurants/{slug}/menu/banners/{id}/claim:
    post:
      tags: [Coupons]
      summary: Claim a banner and return the promotion for immediate cart application
      description: Authenticated customers also save this coupon to My Coupons. Anonymous customers can apply the returned code to their cart.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/MenuBranchQuery'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Claimed or selected coupon
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coupon' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/restaurants/{slug}/coupons:
    get:
      tags: [Coupons]
      summary: List my available claimed coupons for this restaurant
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      responses:
        '200':
          description: My Coupons
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Coupon' } }

  /restaurants/{slug}/branches/{branch_id}/checkout/quote:
    post:
      tags: [Coupons]
      summary: Price a cart with coupons, item sales, and loyalty coins
      description: Does not consume coupons or coins. The strongest order coupon competes per line against item coupons and the effective branch item sale. No discounts stack on a line. One loyalty coin equals one centavo, applied after discounts. Delivery is separate.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/BranchIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/CheckoutSelection' }
                coupon_codes: { type: array, items: { type: string } }
                saved_coupon_ids: { type: array, items: { type: integer }, description: Requires authentication. }
                coins: { type: integer, minimum: 0, description: Requires authentication when nonzero. }
      responses:
        '200':
          description: Server-priced cart and winning discounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutPrice' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # LOYALTY
  # ============================================================
  /restaurants/{slug}/loyalty/balance:
    post:
      tags: [Loyalty]
      summary: Look up an organization's coin balance by CPF without login
      description: Returns only the coin balance. A valid CPF without a wallet returns zero. Requires a published storefront.
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf]
              properties:
                cpf: { type: string, pattern: '^[0-9]{11}$' }
      responses:
        '200':
          description: Coin balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyBalance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/restaurants/{slug}/loyalty/balance:
    get:
      tags: [Loyalty]
      summary: Read the signed-in customer's balance
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      responses:
        '200':
          description: Account balance, including coins earned by CPF before sign-up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyBalance' }

  /loyalty/customers:
    post:
      tags: [Loyalty]
      summary: Register a loyalty CPF (no account required)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf]
              properties:
                cpf: { type: string, pattern: '^\d{11}$' }
                name: { type: string }
                phone: { type: string }
      responses:
        '201':
          description: Created (or returned existing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyCustomer'
        '400': { $ref: '#/components/responses/BadRequest' }

  /loyalty/customers/{customer_ref}:
    parameters:
      - name: customer_ref
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Loyalty]
      summary: Get loyalty record (staff, or account that claimed it)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyCustomer'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /restaurants/{slug}/loyalty/customers/{customer_ref}/wallet:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - name: customer_ref
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Loyalty]
      summary: Get wallet by CPF (staff — no account required)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurants/{slug}/loyalty/customers/{customer_ref}/wallet/transactions:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - name: customer_ref
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Loyalty]
      summary: Wallet transaction history (staff)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWalletTransactions'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Loyalty]
      summary: Credit/debit points (staff, idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points_delta, reason]
              properties:
                points_delta: { type: integer }
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransaction'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Idempotency key mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/loyalty/{slug}/wallet:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
    get:
      tags: [Loyalty]
      summary: My wallet (requires account with claimed CPF)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '403':
          description: No CPF claimed for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/loyalty/{slug}/redeem:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
    post:
      tags: [Loyalty]
      summary: Redeem points (account-only, CPF must be claimed)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: { type: integer, minimum: 1 }
                order_id: { type: integer }
      responses:
        '200':
          description: Redeemed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransaction'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Insufficient balance or CPF not claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me/loyalty/claim/request-code:
    post:
      tags: [Loyalty]
      summary: Request SMS code to claim a CPF wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf]
              properties:
                cpf: { type: string, pattern: '^\d{11}$' }
      responses:
        '202': { description: Code sent (always — prevents enumeration) }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/loyalty/claim:
    post:
      tags: [Loyalty]
      summary: Claim a CPF wallet with SMS code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, sms_code]
              properties:
                cpf: { type: string, pattern: '^\d{11}$' }
                sms_code: { type: string }
      responses:
        '200':
          description: Wallet linked to this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyCustomer'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: CPF already claimed by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================
  # ORDERS
  # ============================================================
  /restaurants/{slug}/branches/{branch_id}/orders:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    get:
      tags: [Orders]
      summary: List submitted branch orders (Owner, Administrator, Manager, or Employee)
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurants/{slug}/branches/{branch_id}/orders/local:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    post:
      tags: [Orders]
      summary: Open dine-in order with an optional table
      description: Omit items to open a draft. A table must already belong to this branch. A guest receives an X-Order-Token response header for subsequent requests.
      security: [{}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocalOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /restaurants/{slug}/branches/{branch_id}/orders/remote:
    parameters:
      - $ref: '#/components/parameters/SlugParam'
      - $ref: '#/components/parameters/BranchIdParam'
    post:
      tags: [Orders]
      summary: Create delivery order
      description: Delivery uses the branch's configured fee. Omit items to open a draft. A guest receives an X-Order-Token response header.
      security: [{}, {bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRemoteOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '400': { $ref: '#/components/responses/BadRequest' }

  /orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderIdParam'
    get:
      tags: [Orders]
      summary: Get order detail
      security: [{bearerAuth: []}, {orderGuest: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{order_id}/status:
    parameters:
      - $ref: '#/components/parameters/OrderIdParam'
    patch:
      tags: [Orders]
      summary: Update order status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummary'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{order_id}/items:
    parameters:
      - $ref: '#/components/parameters/OrderIdParam'
    post:
      tags: [Orders]
      summary: Add item (with side selections)
      description: Adds a line to an unsubmitted draft. The server validates and prices the selection.
      security: [{bearerAuth: []}, {orderGuest: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderItemRequest'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Order is not open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{order_id}/items/{order_item_id}:
    parameters:
      - $ref: '#/components/parameters/OrderIdParam'
      - name: order_item_id
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Orders]
      summary: Void order item (audited)
      security: [{bearerAuth: []}, {orderGuest: []}]
      parameters:
        - name: reason
          in: query
          schema: { type: string }
      responses:
        '204': { description: Voided }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Order is not open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================
  # ORDER SUBMISSION AND QR
  # ============================================================
  /orders/{order_id}/submit:
    post:
      tags: [Orders]
      summary: Submit a draft and freeze its checkout snapshot
      security: [{bearerAuth: []}, {orderGuest: []}]
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderPromotions' }
      responses:
        '200':
          description: Submitted order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '409': { description: Empty, already submitted, or no longer orderable }

  /restaurants/{slug}/branches/{branch_id}/delivery-fee:
    put:
      tags: [Orders]
      summary: Set the branch flat delivery fee (Owner or Administrator)
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/BranchIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: &deliveryFee
              type: object
              required: [delivery_fee_cents]
              properties:
                delivery_fee_cents: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Saved delivery fee
          content:
            application/json:
              schema: *deliveryFee

  /restaurants/{slug}/branches/{branch_id}/order-qr:
    post:
      tags: [Orders]
      summary: Generate a reusable dine-in QR (Owner, Administrator, or Branch Manager)
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/BranchIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                table_id: { type: integer, minimum: 1 }
      responses:
        '201':
          description: QR image and public landing URL
          content:
            application/json:
              schema:
                type: object
                required: [id, url, qr_code_base64]
                properties:
                  id: { type: integer }
                  table_id: { type: integer }
                  url: { type: string, format: uri }
                  qr_code_base64: { type: string, format: byte }

  /order-qr/{code}:
    get:
      tags: [Orders]
      summary: Open the browser landing page for a dine-in QR
      description: The page submits a POST to open a fresh draft. Fetching the HTML alone does not create an order.
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: QR landing page
          content:
            text/html:
              schema: { type: string }

  /order-qr/{code}/open:
    post:
      tags: [Orders]
      summary: Start a new draft from a reusable QR
      security: [{}, {bearerAuth: []}]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: New draft with its QR and optional table attribution
          headers:
            X-Order-Token:
              description: Guest credential for this order. Omitted for authenticated customers.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # PAYMENTS
  # ============================================================
  /orders/{order_id}/transactions:
    parameters:
      - $ref: '#/components/parameters/OrderIdParam'
    get:
      tags: [Payments]
      summary: List transactions
      security: [{bearerAuth: []}, {orderGuest: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Payments]
      summary: Start payment (idempotent)
      description: Only submitted orders can be paid.
      security: [{bearerAuth: []}, {orderGuest: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Idempotency key reused with different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions/{transaction_id}:
    parameters:
      - name: transaction_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Payments]
      summary: Get transaction
      security: [{bearerAuth: []}, {orderGuest: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '403': { $ref: '#/components/responses/Forbidden' }

  /transactions/{transaction_id}/pix:
    parameters:
      - name: transaction_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Payments]
      summary: Get PIX QR / status
      security: [{bearerAuth: []}, {orderGuest: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixCharge'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Payments]
      summary: Generate PIX charge (idempotent)
      security: [{bearerAuth: []}, {orderGuest: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixCharge'
        '403': { $ref: '#/components/responses/Forbidden' }

  /transactions/{transaction_id}/pix/confirm:
    post:
      tags: [Payments]
      summary: Confirm an unexpired mock PIX payment
      security: [{bearerAuth: []}, {orderGuest: []}]
      description: Idempotent per transaction. The mock charge cannot be paid through a banking app.
      parameters:
        - { name: transaction_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Mock transaction settled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Expired charge or invalid payment state }

  /transactions/{transaction_id}/refund:
    parameters:
      - name: transaction_id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Payments]
      summary: Refund (idempotent)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_cents:
                  type: integer
                  description: Partial refund; omit for full
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Not refundable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /restaurants/{slug}/items/{item_id}/reviews:
    get:
      tags: [Reviews]
      summary: List public reviews and sales totals for one dish or combo
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ItemIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Reviews on the 1–3 scale; sold units count submitted, non-cancelled, non-voided purchases of this item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /restaurants/{slug}/reviews:
    get:
      tags: [Reviews]
      summary: List public organization-wide restaurant reviews
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Restaurant reviews on the 1–5 scale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{order_id}/items/{order_item_id}/review:
    post:
      tags: [Reviews]
      summary: Rate a delivered purchase line once
      security: [{bearerAuth: []}, {orderGuest: []}]
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
        - { name: order_item_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 3, description: 1 is sad and 3 is happy. }
                comment: { type: string, maxLength: 2000, description: Requires a signed-in buyer. }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Already reviewed or purchase line ineligible }

  /orders/{order_id}/review:
    post:
      tags: [Reviews]
      summary: Rate the restaurant organization after delivery
      description: Guests may rate once per delivered order. Signed-in buyers can update their one rating and optional comment for the organization, across branches.
      security: [{bearerAuth: []}, {orderGuest: []}]
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 2000, description: Requires a signed-in buyer. }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Guest order already reviewed or order ineligible }

  /orders/{order_id}/receipt:
    parameters:
      - $ref: '#/components/parameters/OrderIdParam'
    get:
      tags: [Payments]
      summary: Get receipt
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # SYSADMINS
  # ============================================================
  /administrators:
    get:
      tags: [Sysadmins]
      summary: List global Administrators (Administrator only)
      responses:
        '200':
          description: Global Administrators
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sysadmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sysadmins]
      summary: Grant global Administrator (Administrator only)
      description: Bootstrap the first Administrator through a trusted database operation on a verified account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointOwnerRequest' }
      responses:
        '201':
          description: Granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sysadmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /administrators/{account_id}:
    parameters:
      - $ref: '#/components/parameters/AccountIdParam'
    delete:
      tags: [Sysadmins]
      summary: Revoke global Administrator (Administrator only)
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sysadmins:
    get:
      tags: [Sysadmins]
      summary: List Sysadmins (Sysadmin or global Administrator)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sysadmin'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sysadmins]
      summary: Grant Sysadmin (existing Sysadmin or global Administrator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id: { type: integer }
      responses:
        '201':
          description: Promoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sysadmin'
        '403': { $ref: '#/components/responses/Forbidden' }

  # ============================================================
  # AUDIT
  # ============================================================
  /audit:
    get:
      tags: [Audit]
      summary: List audit entries
      parameters:
        - name: restaurant_slug
          in: query
          schema: { type: string }
        - name: entity_type
          in: query
          schema: { type: string }
        - name: entity_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntries'
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    orderGuest:
      type: apiKey
      in: header
      name: X-Order-Token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT accepted from any of:
        - `POST /auth/register`
        - `POST /auth/login`
        - `POST /auth/login/phone/verify`
        - `POST /auth/register/phone/verify`
        - `POST /auth/refresh`

        Send the access token as a bearer credential. Refresh tokens are accepted
        only by the session endpoints that explicitly request them.

  parameters:
    SlugParam:
      name: slug
      in: path
      required: true
      schema: { type: string }
    BranchIdParam:
      name: branch_id
      in: path
      required: true
      schema: { type: integer }
    MenuBranchQuery:
      name: branch_id
      in: query
      description: Optional branch scope. Include it to read branch stock and discounts or cancel a sale belonging to that branch.
      schema: { type: integer, minimum: 1 }
    ItemIdParam:
      name: item_id
      in: path
      required: true
      schema: { type: integer }
    OrderIdParam:
      name: order_id
      in: path
      required: true
      schema: { type: integer }
    AccountIdParam:
      name: account_id
      in: path
      required: true
      schema: { type: integer }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 64 }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Missing/invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ---------- Errors ----------
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details: { type: object, additionalProperties: true }
    ValidationError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, example: VALIDATION_ERROR }
        fields:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    # ---------- Auth ----------
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        phone:
          type: string
          description: Stored as unverified contact data. Use /me/phone/verify to enable OTP login.
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: Optional. Graduates a matching shadow account in place; conflicts with a real account.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: seconds }
    Account:
      type: object
      required: [id, created_at, is_shadow]
      properties:
        id: { type: integer }
        email:
          type: string
          format: email
          nullable: true
          description: Null for phone-only accounts
        email_verified: { type: boolean }
        phone:
          type: string
          nullable: true
          description: Null for email-only accounts
        phone_verified:
          type: boolean
          description: Only verified phones can be used for OTP login
        name: { type: string, nullable: true }
        avatar_url: { type: string }
        cpf: { type: string, nullable: true, pattern: '^[0-9]{11}$' }
        cpf_claimed_at: { type: string, format: date-time, nullable: true }
        is_shadow: { type: boolean, description: CPF-only accounts cannot authenticate until graduated. }
        created_at: { type: string, format: date-time }
    JwtClaims:
      type: object
      description: |
        Informational only. Clients must not trust these claims for authorization —
        the server is the source of truth. Provided so clients can make UI decisions.
      properties:
        sub: { type: integer }
        typ: { type: string, enum: [user, terminal] }
        role: { type: string, enum: [OWNER, MANAGER, EMPLOYEE, TERMINAL] }
        restaurant_slug: { type: string, nullable: true }
        branch_id: { type: integer, nullable: true }
        scopes: { type: array, items: { type: string } }
        jti: { type: string }
        iat: { type: integer }
        exp: { type: integer }

    # ---------- Addresses ----------
    Address:
      type: object
      required: [cep, street, number]
      properties:
        cep: { type: string, pattern: '^\d{8}$' }
        street: { type: string }
        number: { type: string }
        apt: { type: string }
        complement: { type: string }
        city: { type: string }
        state: { type: string }
    SavedAddress:
      type: object
      required: [id, address, is_default]
      properties:
        id: { type: integer }
        label: { type: string, example: Home }
        address:
          $ref: '#/components/schemas/Address'
        is_default: { type: boolean }
    CreateAddressRequest:
      type: object
      required: [address]
      properties:
        label: { type: string }
        address:
          $ref: '#/components/schemas/Address'
        is_default: { type: boolean, default: false }

    # ---------- Restaurants ----------
    Restaurant:
      type: object
      required: [slug, name, created_at]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        icon_url: { type: string, nullable: true }
        cover_url: { type: string, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateRestaurantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug:
          type: string
          description: Immutable after creation. Auto-generated if omitted.
        description: { type: string }
        icon_url: { type: string, maxLength: 2048, description: HTTP(S) or a local /media/ URL. }
        cover_url: { type: string, maxLength: 2048, description: HTTP(S) or a local /media/ URL. }
    UpdateRestaurantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        icon_url: { type: string, maxLength: 2048, description: Omit to keep the current URL; send an empty string to clear it. }
        cover_url: { type: string, maxLength: 2048, description: Omit to keep the current URL; send an empty string to clear it. }
    MyRestaurant:
      type: object
      required: [restaurant, role]
      properties:
        restaurant:
          $ref: '#/components/schemas/Restaurant'
        role:
          type: string
          enum: [OWNER, MANAGER, ANALYST, EMPLOYEE]
        branch_ids:
          type: array
          items: { type: integer }
          description: Explicit assignments for a branch-scoped role; empty for an organization role.
    Membership:
      type: object
      required: [account_id, role]
      properties:
        account_id: { type: integer }
        account_email:
          type: string
          format: email
          nullable: true
        account_phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [OWNER, ANALYST]
        created_at: { type: string, format: date-time }
    AppointOwnerRequest:
      type: object
      required: [account_id]
      properties:
        account_id: { type: integer }
    AddManagerRequest:
      type: object
      required: [account_id]
      properties:
        account_id: { type: integer }

    # ---------- Branches ----------
    Branch:
      type: object
      required: [id, restaurant_slug, name, cnpj, address, is_active, cnpj_verified]
      properties:
        id: { type: integer }
        restaurant_slug: { type: string }
        name: { type: string }
        cnpj: { type: string, pattern: '^\d{14}$' }
        owner_cnpj: { type: string, pattern: '^\d{14}$' }
        cnpj_verified: { type: boolean }
        address:
          $ref: '#/components/schemas/Address'
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateBranchRequest:
      type: object
      required: [name, cnpj, owner_cnpj, address]
      properties:
        name: { type: string }
        cnpj:
          type: string
          pattern: '^\d{14}$'
          description: Pending manual review by a platform Sysadmin.
        owner_cnpj:
          type: string
          pattern: '^\d{14}$'
          description: CNPJ of the owner entity on record
        address:
          $ref: '#/components/schemas/Address'
    UpdateBranchRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    Phone:
      type: object
      required: [id, phone_number]
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        phone_number: { type: string }
        phone_type:
          type: string
          enum: [whatsapp, landline, mobile, other]
    CreatePhoneRequest:
      type: object
      required: [phone_number]
      properties:
        phone_number: { type: string }
        phone_type:
          type: string
          enum: [whatsapp, landline, mobile, other]

    OperatingHour:
      type: object
      required: [weekday, is_closed]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        opens_at:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        closes_at:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        is_closed: { type: boolean }

    Table:
      type: object
      required: [id, branch_id, number, is_active]
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        number: { type: integer }
        seats: { type: integer }
        display_order: { type: integer }
        is_active: { type: boolean }
    CreateTableRequest:
      type: object
      required: [number]
      properties:
        number: { type: integer, minimum: 1 }
        seats: { type: integer, minimum: 1 }
        display_order: { type: integer }
        is_active: { type: boolean, default: true }

    # ---------- Employees ----------
    Employee:
      type: object
      required: [id, branch_id, name, position, is_active]
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        name: { type: string }
        cpf: { type: string, pattern: '^\d{11}$', nullable: true }
        position:
          type: string
          enum: [WAITER, COOK, CASHIER, BARTENDER, HOST, OTHER]
        account_id:
          type: integer
          nullable: true
          description: Populated once invite is accepted
        is_active: { type: boolean }
        hired_at: { type: string, format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateEmployeeRequest:
      type: object
      required: [account_id, position]
      properties:
        account_id: { type: integer, minimum: 1 }
        position:
          type: string
          enum: [WAITER, COOK, CASHIER, BARTENDER, HOST, OTHER]
    UpdateEmployeeRequest:
      type: object
      properties:
        name: { type: string }
        position:
          type: string
          enum: [WAITER, COOK, CASHIER, BARTENDER, HOST, OTHER]
        is_active: { type: boolean }

    # ---------- Staff sessions ----------
    StaffSession:
      type: object
      required: [id, branch_id, shift_code, opened_at]
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        shift_code: { type: string }
        qr_token: { type: string }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
    StaffCheckIn:
      type: object
      required: [id, staff_session_id, account_id, checked_in_at]
      properties:
        id: { type: integer }
        staff_session_id: { type: integer }
        account_id: { type: integer }
        checked_in_at: { type: string, format: date-time }
        checked_out_at: { type: string, format: date-time, nullable: true }

    # ---------- Menu ----------
    MenuLayout:
      type: object
      required: [restaurant_slug]
      properties:
        restaurant_slug: { type: string }
        name: { type: string }
        template_style: { type: string, example: classic }
        accent_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        secondary_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        typography: { type: string }
        updated_at: { type: string, format: date-time }
    UpdateMenuLayoutRequest:
      type: object
      properties:
        name: { type: string }
        template_style: { type: string, enum: [classic, experience] }
        accent_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        secondary_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        typography: { type: string }

    Category:
      type: object
      required: [id, name, display_order]
      properties:
        id: { type: integer }
        restaurant_slug: { type: string }
        name: { type: string }
        display_order: { type: integer }
        created_at: { type: string, format: date-time }
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        display_order: { type: integer }
    UpdateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        display_order: { type: integer }

    # ---------- Items ----------
    Item:
      type: object
      required: [id, category_id, name, base_price_cents, is_combo, is_available]
      properties:
        id: { type: integer }
        category_id: { type: integer }
        name: { type: string }
        description: { type: string }
        base_price_cents: { type: integer }
        effective_price_cents: { type: integer, description: Price after the applicable temporary sale, before options. }
        base_cost_cents: { type: integer, description: Returned only to Owner, Administrator, or Analyst when recorded. }
        allows_review: { type: boolean }
        photo_url: { type: string }
        is_combo: { type: boolean }
        is_available: { type: boolean }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateItemRequest:
      type: object
      required: [category_id, name, base_price_cents]
      properties:
        category_id: { type: integer }
        name: { type: string }
        description: { type: string }
        base_price_cents: { type: integer, minimum: 0 }
        base_cost_cents: { type: integer, minimum: 0, nullable: true }
        allows_review: { type: boolean, default: true }
        photo_url: { type: string }
        is_combo: { type: boolean, default: false }
        is_available: { type: boolean, default: true }
    UpdateItemRequest:
      type: object
      required: [category_id, name, base_price_cents, is_combo, is_available]
      properties:
        category_id: { type: integer }
        name: { type: string }
        description: { type: string }
        base_price_cents: { type: integer, minimum: 0 }
        base_cost_cents: { type: integer, minimum: 0, nullable: true }
        allows_review: { type: boolean }
        photo_url: { type: string }
        is_combo: { type: boolean }
        is_available: { type: boolean }
    PatchItemRequest:
      type: object
      properties:
        category_id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        base_price_cents: { type: integer, minimum: 0 }
        base_cost_cents: { type: integer, minimum: 0, nullable: true }
        allows_review: { type: boolean }
        photo_url: { type: string, nullable: true }
        is_combo: { type: boolean }
        is_available: { type: boolean }
    ItemDetail:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          properties:
            ingredients:
              type: array
              items:
                $ref: '#/components/schemas/ItemIngredient'
            sides:
              type: array
              items:
                $ref: '#/components/schemas/Side'
            combo_items:
              type: array
              items:
                $ref: '#/components/schemas/ComboItem'

    # ---------- Ingredients ----------
    Ingredient:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        default_unit:
          type: string
          enum: [g, kg, ml, l, un, cs, colher]
    ItemIngredient:
      type: object
      required: [id, item_id, ingredient_id, name, is_removable]
      properties:
        id: { type: integer }
        item_id: { type: integer }
        ingredient_id: { type: integer }
        name: { type: string }
        quantity: { type: number }
        unit:
          type: string
          enum: [g, kg, ml, l, un, cs, colher]
        is_removable: { type: boolean }

    # ---------- Sides ----------
    Side:
      type: object
      required: [id, item_id, title, min_options, max_options, options]
      properties:
        id: { type: integer }
        item_id: { type: integer }
        title: { type: string }
        min_options: { type: integer }
        max_options: { type: integer }
        options:
          type: array
          items:
            $ref: '#/components/schemas/SideOption'
    SideOption:
      type: object
      required: [id, side_id, name, additional_price_cents, is_available]
      properties:
        id: { type: integer }
        side_id: { type: integer }
        name: { type: string }
        additional_price_cents: { type: integer, minimum: 0 }
        is_available: { type: boolean }

    # ---------- Combos ----------
    ComboItem:
      type: object
      required: [id, combo_id, sub_item_id, sub_item_name, quantity]
      properties:
        id: { type: integer }
        combo_id: { type: integer }
        sub_item_id: { type: integer }
        sub_item_name: { type: string }
        quantity: { type: integer, minimum: 1 }
        removable_ingredients:
          type: array
          description: Exclusions can be requested for each serving of this component as preparation notes.
          items:
            $ref: '#/components/schemas/ItemIngredient'

    # ---------- Sales ----------
    ItemSale:
      type: object
      required: [id, item_id, discount_type, discount_value, starts_at, ends_at]
      properties:
        id: { type: integer }
        item_id: { type: integer }
        branch_id: { type: integer, minimum: 1 }
        discount_type:
          type: string
          enum: [percent, fixed_cents]
        discount_value: { type: integer }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    CreateItemSaleRequest:
      type: object
      required: [discount_type, discount_value, starts_at, ends_at]
      properties:
        branch_id: { type: integer, minimum: 1, description: Required for Branch Managers; otherwise omission creates an organization-wide sale. }
        discount_type:
          type: string
          enum: [percent, fixed_cents]
        discount_value: { type: integer, minimum: 1 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }

    # ---------- Coupons ----------
    CouponMetadata:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        target_scope: { type: string, enum: [order, item, combo], default: order }
        target_item_id: { type: integer, nullable: true, description: Required for item and combo scopes. }
        is_banner: { type: boolean, default: false }
        background_image_url: { type: string, description: Required with a title for banner coupons. }
    Coupon:
      allOf:
        - $ref: '#/components/schemas/CouponMetadata'
      type: object
      required: [id, restaurant_slug, code, discount_type, discount_value, used_count, is_active]
      properties:
        id: { type: integer }
        restaurant_slug: { type: string }
        code: { type: string }
        discount_type:
          type: string
          enum: [percent, fixed_cents]
        discount_value: { type: integer }
        min_order_cents: { type: integer }
        expires_at: { type: string, format: date-time, nullable: true }
        max_uses: { type: integer, nullable: true }
        used_count: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    CreateCouponRequest:
      allOf:
        - $ref: '#/components/schemas/CouponMetadata'
      type: object
      required: [code, discount_type, discount_value]
      properties:
        code: { type: string }
        discount_type:
          type: string
          enum: [percent, fixed_cents]
        discount_value: { type: integer, minimum: 1 }
        min_order_cents: { type: integer, minimum: 0 }
        expires_at: { type: string, format: date-time, nullable: true }
        max_uses: { type: integer, minimum: 1, nullable: true }
        is_active: { type: boolean, default: true }
    UpdateCouponRequest:
      allOf:
        - $ref: '#/components/schemas/CouponMetadata'
      type: object
      properties:
        discount_value: { type: integer }
        min_order_cents: { type: integer }
        discount_type: { type: string, enum: [percent, fixed_cents] }
        expires_at: { type: string, format: date-time, nullable: true }
        max_uses: { type: integer, minimum: 1, nullable: true }
        is_active: { type: boolean }
    CouponValidation:
      type: object
      required: [valid, code]
      properties:
        valid: { type: boolean }
        code: { type: string }
        reason:
          type: string
          enum: [EXPIRED, MAX_USES_REACHED, MIN_ORDER_NOT_MET, INACTIVE]
        discount_cents:
          type: integer
          description: Present for valid order-wide coupons. Item and combo coupons require a cart quote.
    CheckoutSelection:
      type: object
      required: [item_id, quantity]
      properties:
        item_id: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1 }
        option_ids: { type: array, items: { type: integer } }
        remove_ingredient_ids: { type: array, items: { type: integer } }
        notes: { type: string }
        component_removals:
          type: array
          items:
            type: object
            required: [combo_item_id, unit]
            properties:
              combo_item_id: { type: integer, minimum: 1 }
              unit: { type: integer, minimum: 1 }
              remove_ingredient_ids: { type: array, items: { type: integer } }
    CheckoutPrice:
      type: object
      required: [lines, coupons, subtotal_cents, discount_cents, coins_redeemed, payable_cents]
      properties:
        lines:
          type: array
          items:
            type: object
            properties:
              item: { type: object, description: Item and customization snapshot before discounts. }
              subtotal_cents: { type: integer }
              discount_cents: { type: integer }
              coupon_id: { type: integer, description: Omitted if the line received an item sale or no discount. }
        coupons:
          type: array
          items:
            type: object
            properties:
              coupon_id: { type: integer }
              code: { type: string }
              discount_cents: { type: integer }
        subtotal_cents: { type: integer }
        discount_cents: { type: integer }
        coins_redeemed: { type: integer }
        payable_cents: { type: integer }

    # ---------- Loyalty ----------
    LoyaltyCustomer:
      type: object
      required: [cpf, created_at]
      properties:
        cpf: { type: string, pattern: '^\d{11}$' }
        name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        account_id:
          type: integer
          nullable: true
          description: Populated after the CPF owner claims the record
        claimed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Wallet:
      type: object
      required: [user_cpf, restaurant_slug, points_balance]
      properties:
        user_cpf: { type: string }
        restaurant_slug: { type: string }
        points_balance: { type: integer }
    WalletTransaction:
      type: object
      required: [id, points_delta, balance_after, reason, created_at]
      properties:
        id: { type: integer }
        points_delta: { type: integer }
        balance_after: { type: integer }
        reason: { type: string }
        order_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    # ---------- Orders ----------
    Review:
      type: object
      required: [id, rating, created_at]
      properties:
        id: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        created_at: { type: string, format: date-time }
    ReviewPage:
      type: object
      required: [data, page, page_size, summary]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Review' } }
        page: { type: integer }
        page_size: { type: integer }
        summary:
          type: object
          required: [review_count, rating_sum, average_rating]
          properties:
            review_count: { type: integer }
            rating_sum: { type: integer }
            average_rating: { type: number, nullable: true }
            units_sold: { type: integer, description: Present only for item and combo reviews. }
    OrderStatus:
      type: string
      enum: [pending, preparing, ready, delivered, cancelled]
    OrderType:
      type: string
      enum: [local, remote]
    OrderSummary:
      type: object
      required: [id, branch_id, order_type, status, subtotal_cents, discount_cents, freight_cents, total_cents, created_at]
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        user_id: { type: integer, nullable: true }
        order_type:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        subtotal_cents: { type: integer }
        discount_cents: { type: integer }
        freight_cents: { type: integer }
        total_cents: { type: integer }
        coupon_code: { type: string, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true, description: Null for drafts. }
        qr_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            local_info:
              type: object
              nullable: true
              properties:
                table_id: { type: integer, nullable: true }
                table_number: { type: integer, nullable: true }
            remote_info:
              type: object
              nullable: true
              properties:
                delivery_address:
                  $ref: '#/components/schemas/Address'
                phone: { type: string }
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
    OrderItem:
      type: object
      description: On submitted orders, the items array contains both billable lines and combo preparation lines. Preparation lines reference their combo parent and carry no separate charge.
      required: [id, order_id, item_id, item_name, unit_price_cents, quantity, line_total_cents]
      properties:
        id: { type: integer }
        order_id: { type: integer }
        item_id: { type: integer }
        item_name: { type: string }
        unit_price_cents: { type: integer }
        quantity: { type: integer }
        notes: { type: string }
        parent_order_item_id:
          type: integer
          nullable: true
          description: ID of the billable combo line for this preparation line. Null on submitted billable items; omitted on drafts.
        selected_options:
          type: array
          items:
            $ref: '#/components/schemas/SelectedOption'
        line_total_cents: { type: integer }
        voided_at: { type: string, format: date-time, nullable: true }
        voided_reason: { type: string, nullable: true }
    SelectedOption:
      type: object
      required: [group, name, additional_price_cents]
      properties:
        group: { type: string }
        name: { type: string }
        additional_price_cents: { type: integer }
    AddOrderItemRequest:
      $ref: '#/components/schemas/CheckoutSelection'
    LoyaltyBalance:
      type: object
      required: [coins_amount]
      properties:
        coins_amount: { type: integer, minimum: 0 }
    OrderPromotions:
      type: object
      properties:
        coupon_codes: { type: array, items: { type: string } }
        saved_coupon_ids: { type: array, items: { type: integer } }
        coins: { type: integer, minimum: 0 }
        customer_cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: Optional on guest orders. After full payment, earn the restaurant's configured coins per real of discounted merchandise, excluding delivery; rounded down.
    CreateLocalOrderRequest:
      allOf:
        - $ref: '#/components/schemas/OrderPromotions'
      type: object
      properties:
        table_id: { type: integer, minimum: 1 }
        table_number:
          type: integer
          minimum: 1
          description: Existing table number at the branch. Omit both table fields for tableless orders.
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AddOrderItemRequest'
    CreateRemoteOrderRequest:
      allOf:
        - $ref: '#/components/schemas/OrderPromotions'
      type: object
      required: [phone, delivery_address]
      properties:
        delivery_address:
          $ref: '#/components/schemas/Address'
        phone: { type: string }
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AddOrderItemRequest'

    # ---------- Payments ----------
    Transaction:
      type: object
      required: [id, order_id, amount_cents, payment_method, status, created_at]
      properties:
        id: { type: integer }
        order_id: { type: integer }
        amount_cents: { type: integer }
        payment_method:
          type: string
          enum: [credit_card, debit_card, pix, cash]
        status:
          type: string
          enum: [pending, paid, failed, refunded, partially_refunded]
        refunded_cents: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateTransactionRequest:
      type: object
      required: [payment_method, amount_cents]
      properties:
        payment_method:
          type: string
          enum: [credit_card, debit_card, pix, cash]
        amount_cents: { type: integer, minimum: 1 }
    PixCharge:
      type: object
      required: [transaction_id, copy_paste_code, qr_code_base64, expires_at]
      properties:
        transaction_id: { type: integer }
        copy_paste_code: { type: string }
        qr_code_base64: { type: string }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
    Receipt:
      type: object
      required: [receipt_code, order_id, issued_at, receipt]
      properties:
        receipt_code: { type: string }
        order_id: { type: integer }
        issued_at: { type: string, format: date-time }
        receipt:
          type: object
          additionalProperties: true

    # ---------- Sysadmins / audit ----------
    Sysadmin:
      type: object
      required: [id, account_id, created_at]
      properties:
        id: { type: integer }
        account_id: { type: integer }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, action, entity_type, entity_id, created_at]
      properties:
        id: { type: integer }
        actor_account_id: { type: integer, nullable: true }
        actor_role: { type: string, nullable: true }
        restaurant_slug: { type: string, nullable: true }
        action: { type: string, example: 'owner.appointed' }
        entity_type: { type: string }
        entity_id: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    # ---------- Pagination envelopes ----------
    PaginatedRestaurants:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Restaurant'
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    PaginatedBranches:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    PaginatedEmployees:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    PaginatedItems:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    PaginatedOrders:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    PaginatedCoupons:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Coupon'
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    PaginatedWalletTransactions:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    PaginatedAuditEntries:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
